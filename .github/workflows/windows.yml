name: windows

# 里程碑 16：Windows 上运行。「verify」= ffmpeg / 编码器 / keyring / webview 探针；
# 「test」在 Windows 上跑完整 pytest；「build」打 zip + 冒烟 + 上传产物。
# 产物用 archive: false 直接上传 zip 本身（单层，不再被 Actions 套一层 zip）。
# 推送 v* tag 时，「release」job 校验 tag == v<pyproject version> 后发布 GitHub Release（附该 zip）。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
      - run: uv python install 3.12
      - run: uv sync
      - name: 下载并自检 ffmpeg（SHA256 钉死）
        run: uv run python packaging/fetch_ffmpeg_win.py
      - name: 编码器探针（h264_mf / libopenh264，各编 5 秒 1080p）
        run: uv run python packaging/ci_probe_win.py
      - name: keyring 读写删（服务名 ai-cut-ci，不是 ai-cut）
        run: uv run python packaging/ci_probe_win.py --keyring
      - name: pywebview 渲染器可导入
        run: uv run python -c "import webview, webview.platforms.edgechromium, clr_loader; print('webview ok')"

  test:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      AI_CUT_SECRETS: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run python packaging/fetch_ffmpeg_win.py
      - run: uv run pytest -p no:cacheprovider

  build:
    needs: [verify, test]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      AI_CUT_SECRETS: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 构建号 = git 提交数，需要完整历史
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
      - run: uv python install 3.12
      - run: uv sync --group dev
      - name: 构建 Windows 包（ffmpeg 下载自检 + PyInstaller + zip）
        run: uv run python packaging/build_win.py
      - name: 打包产物完整性（Python.NET 与 WebView2 的 dll 必须在包里）
        shell: pwsh
        run: |
          $missing = @()
          foreach ($n in "Python.Runtime.dll", "WebView2Loader.dll", "Microsoft.Web.WebView2.Core.dll") {
            if (-not (Get-ChildItem -Recurse -Filter $n "dist\ai-cut\_internal")) { $missing += $n }
          }
          if ($missing) { Write-Host "缺少：$($missing -join ', ')"; exit 1 }
      - name: 冒烟：打包版 exe 跑 CLI list（隔离目录，退出码必须为 0 且留下日志）
        timeout-minutes: 3
        shell: pwsh
        env:
          AI_CUT_CONFIG_DIR: ${{ runner.temp }}\aicut-smoke\config
          AI_CUT_PROJECTS: ${{ runner.temp }}\aicut-smoke\projects
          AI_CUT_DRAFT_ROOT: ${{ runner.temp }}\aicut-smoke\drafts
          AI_CUT_LOG_DIR: ${{ runner.temp }}\aicut-smoke\logs
        run: |
          foreach ($d in $env:AI_CUT_CONFIG_DIR, $env:AI_CUT_PROJECTS, $env:AI_CUT_DRAFT_ROOT, $env:AI_CUT_LOG_DIR) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }
          # 窗口化 exe 没有控制台：不看 stdout，只看退出码和日志（cli-*.log）
          # 与剪辑台拉起任务子进程一样接上输出管道（重定向到文件），失败时把内容打出来
          $out = Join-Path $env:AI_CUT_LOG_DIR "smoke-stdout.txt"
          $err = Join-Path $env:AI_CUT_LOG_DIR "smoke-stderr.txt"
          $p = Start-Process -FilePath "dist\ai-cut\ai-cut.exe" -ArgumentList "--aicut-cli", "list" -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force
            Write-Host "超时 120 秒，已结束进程"
            Get-ChildItem -Recurse $env:AI_CUT_LOG_DIR | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName }
            exit 1
          }
          Write-Host "exit code: $($p.ExitCode)"
          $logs = Get-ChildItem -Recurse -Filter "cli*.log" $env:AI_CUT_LOG_DIR
          $ran = $logs | Select-String -SimpleMatch "pid=" -List
          if ($p.ExitCode -ne 0 -or -not $ran) {
            Get-ChildItem -Recurse $env:AI_CUT_LOG_DIR | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName }
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/ai-cut-windows-x64-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag 必须等于 v + pyproject.toml 的 version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG 与 pyproject.toml 的版本 v$VERSION 不一致，拒绝发布"
            exit 1
          fi
      - name: tag 指向的提交必须在 main 上
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "提交 $GITHUB_SHA 不在 main 上，拒绝发布"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-cut-windows-x64-*
          merge-multiple: true
          skip-decompress: true
          path: dist
      - name: 创建 GitHub Release（可重跑：先建草稿，传完 zip 再公开）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ZIPS=(dist/ai-cut-windows-x64-*.zip)
          if [ "${#ZIPS[@]}" -ne 1 ] || [ ! -f "${ZIPS[0]}" ]; then
            echo "dist 里应该恰好有 1 个 ai-cut-windows-x64-*.zip，实际 ${#ZIPS[@]} 个"
            ls -la dist
            exit 1
          fi
          ZIP="${ZIPS[0]}"
          case "$(basename "$ZIP")" in
            *"-${TAG#v}-"*) ;;
            *) echo "$ZIP 的文件名里没有版本 ${TAG#v}，拒绝发布"; exit 1 ;;
          esac
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## 怎么装（Windows 10/11 x64）

          1. 下载下面的 zip。
          2. 右键 zip →「全部提取」，提取到一个普通文件夹。不要在压缩包预览窗口里双击或把文件夹拖出来（会漏文件）。
          3. 打开提取出来的 ai-cut 文件夹，运行 ai-cut\ai-cut.exe。

          首次运行如果弹出蓝色的「Windows 已保护你的电脑」（SmartScreen）：点「更多信息 → 仍要运行」，以后直接双击即可。

          界面空白或打不开：需要微软的 WebView2 运行时。Windows 11 自带；Windows 10 一般会自动装好，没有的话搜索「WebView2 Runtime」，下载「Evergreen 独立安装程序」装一次：https://developer.microsoft.com/microsoft-edge/webview2/

          ---
          EOF
          # 幂等：Release 不存在就先建草稿；zip 用 --clobber 上传（重跑可覆盖）；传完再公开，
          # 这样上传中途失败不会留下没有 zip 的已发布 Release。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "AI粗剪 $TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
          gh release upload "$TAG" "$ZIP" --clobber
          gh release edit "$TAG" --draft=false
