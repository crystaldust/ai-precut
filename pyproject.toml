[project]
name = "ai-cut"
version = "0.1.0"
description = "AI 粗剪工具：素材 → 三路分析 → 片段浏览 → 覆盖式选段 → 剪映工程"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
  "pywebview>=5.0",
  "pyJianYingDraft==0.3.*",
  "keyring>=24",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pyinstaller>=6.10",
  "pytest-cov>=6",
]

[tool.uv]
# 这是一个脚本式仓库，不需要把自己打成 wheel
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# 产品代码：CLI、流水线、剪辑台、桌面入口，以及随包分发的草稿校验器（ai-cut.spec hiddenimports）
source = ["aicut", "app", "gui", "pipeline"]
source_pkgs = ["research.validate_draft"]
# packaging/build_package.py 不列：仓库根 packaging/ 与 PyPI 的 packaging 同名，按名解析会串

[tool.coverage.report]
fail_under = 80          # PRD：测试覆盖率 ≥ 80%（KI-38）；只在 `uv run pytest --cov` 时判定
skip_covered = true
show_missing = true
