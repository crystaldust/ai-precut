<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>剪辑台</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <nav id="rail" class="rail" aria-label="项目栏">
    <div class="rail-mini">
      <button class="ghost rail-burger" data-act="toggleRail" title="项目栏" aria-label="展开项目栏">☰</button>
      <span class="rail-initial" id="railInitial"></span>
    </div>
    <div class="rail-full">
      <div class="rail-head">
        <span class="brand">剪辑台</span>
        <button class="ghost pin" id="btnPin" data-act="togglePin" aria-pressed="false">固定</button>
      </div>
      <button class="primary" data-act="openNew">＋ 新建项目</button>
      <ul id="projects"></ul>
    </div>
  </nav>

  <main>
    <header id="topbar">
      <div class="title"><h1 id="title">还没有选择项目</h1><div class="meta" id="meta"></div></div>
      <nav class="steps" id="steps" aria-label="步骤"></nav>
      <button class="chip" id="chip" data-act="openJobDetail" hidden></button>
      <div class="more-wrap">
        <button class="ghost" id="btnMore" data-act="toggleMore">更多 ▾</button>
        <div class="menu" id="moreMenu"></div>
      </div>
    </header>
    <div class="warnbar" id="stalebar" role="status" hidden></div>
    <div class="warnbar" id="warnbar" role="status" hidden></div>
    <div class="warnbar" id="savebar" role="alert" hidden></div>
    <div id="banner" role="status"></div>
    <div class="stage" id="stage"></div>
    <footer class="nav" id="nav"></footer>
  </main>
</div>

<div class="mask" id="mask">
  <div class="modal" id="modal">
    <h2 id="modalTitle">处理中</h2>
    <div class="c">
      <div id="modalBody"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/common.js"></script>
<script src="/static/base.js"></script>
<script src="/static/jobs.js"></script>
<script src="/static/settings.js"></script>
<script src="/static/support.js"></script>
<script src="/static/sidebar.js"></script>
<script src="/static/wizard.js"></script>
<script src="/static/shortcuts.js"></script>
<script src="/static/cliplist.js"></script>
<script src="/static/project-form.js"></script>
<script src="/static/step-analyze.js"></script>
<script src="/static/step-browse.js"></script>
<script src="/static/batch-select.js"></script>
<script src="/static/step-criteria.js"></script>
<script src="/static/criteria-analysis.js"></script>
<script src="/static/criteria-pending.js"></script>
<script src="/static/reselect.js"></script>
<script src="/static/result-table.js"></script>
<script src="/static/result-unused.js"></script>
<script src="/static/step-result.js"></script>
<script src="/static/step-export.js"></script>
<script src="/static/export-compare.js"></script>
<script src="/static/app.js"></script>
<script src="/static/main.js"></script>
</body>
</html>
